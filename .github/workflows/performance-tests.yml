name: Performance Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which k6 suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - details
          - search
          - suggestions

jobs:
  performance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_SUITE: ${{ github.event.inputs.suite || 'all' }}
    
    services:
      influxdb:
        image: influxdb:1.8
        env:
          INFLUXDB_DB: k6
        ports:
          - 8086:8086
        options: >-
          --health-cmd="curl -f http://localhost:8086/ping || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start API
        run: |
          npm start > api.log 2>&1 &
          echo $! > api.pid
        env:
          NODE_ENV: test
          INFLUXDB_URL: http://localhost:8086
          INFLUXDB_DATABASE: k6

      - name: Wait for API to be ready
        timeout-minutes: 2
        run: |
          max_attempts=30
          for i in $(seq 1 $max_attempts); do
            if curl -sf http://localhost:20275/health >/dev/null 2>&1; then
              echo "✅ API is ready"
              exit 0
            fi
            
            # Check if API process is still alive
            if ! kill -0 $(cat api.pid) 2>/dev/null; then
              echo "❌ API process died"
              echo "📋 API Logs:"
              cat api.log
              exit 1
            fi
            
            echo "Waiting for API... ($i/$max_attempts)"
            sleep 2
          done
          echo "❌ API failed to start"
          cat api.log
          exit 1

      - name: Set up k6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6-stable.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run Smoke Tests
        if: env.TEST_SUITE == 'all' || env.TEST_SUITE == 'smoke'
        run: k6 run --config perf/configs/smoke.json --out influxdb=http://localhost:8086/k6 perf/scripts/pokemon-list.js
        continue-on-error: false

      - name: Run Details Test
        if: env.TEST_SUITE == 'all' || env.TEST_SUITE == 'details'
        run: k6 run --config perf/configs/smoke.json --out influxdb=http://localhost:8086/k6 perf/scripts/pokemon-details.js
        continue-on-error: true

      - name: Run Search Test
        if: env.TEST_SUITE == 'all' || env.TEST_SUITE == 'search'
        run: k6 run --config perf/configs/smoke.json --out influxdb=http://localhost:8086/k6 perf/scripts/pokemon-search.js
        continue-on-error: true

      - name: Run Suggestions Test
        if: env.TEST_SUITE == 'all' || env.TEST_SUITE == 'suggestions'
        run: k6 run --config perf/configs/smoke.json --out influxdb=http://localhost:8086/k6 perf/scripts/pokemon-suggestions.js
        continue-on-error: true

      - name: Stop API
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill $(cat api.pid) || true
            sleep 1
          fi

      - name: Upload k6 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: |
            k6-results/
          retention-days: 30

  # Optional: Test against production endpoint
  production-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run on main branch push, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up k6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6-stable.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Smoke Test Against Production
        run: |
          k6 run \
            --config perf/configs/smoke.json \
            -e BASE_URL=${{ secrets.PRODUCTION_API_URL }} \
            perf/scripts/pokemon-list.js
        continue-on-error: true

      - name: Report Results
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Production smoke tests failed. Check the workflow logs.'
            })
