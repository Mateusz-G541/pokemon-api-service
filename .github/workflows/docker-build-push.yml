name: Build and Push Docker Image to DockerHub

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Allow manual trigger

env:
  DOCKER_IMAGE_NAME: pokemon-api-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        if: github.event_name != 'pull_request'
        timeout-minutes: 10
        run: |
          echo "🧪 Testing Docker image..."
          docker run --rm -d \
            -e PORT=3001 -e HOST=0.0.0.0 \
            -p 20275:3001 \
            --name test-container \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          
          # Give container initial time to start and load data
          echo "⏳ Waiting for container to initialize (up to 60 seconds)..."
          sleep 5
          
          # Poll for health check with longer timeout
          max_attempts=15
          for i in $(seq 1 $max_attempts); do
            # Check if container is still running
            if ! docker ps | grep -q test-container; then
              echo "❌ Container stopped unexpectedly on attempt $i"
              echo "📋 Container logs:"
              docker logs test-container 2>&1 || echo "Could not retrieve logs"
              docker rm test-container 2>/dev/null || true
              exit 1
            fi
            
            # Test health endpoint with increased timeout
            if curl -4 -fsS --connect-timeout 3 --max-time 5 http://127.0.0.1:20275/health >/dev/null 2>&1; then
              echo "✅ Health check passed on attempt $i!"
              docker stop test-container
              echo "✅ Docker image test passed!"
              exit 0
            fi
            
            echo "⏳ Health check attempt $i/$max_attempts failed, retrying in 4 seconds..."
            sleep 4
          done
          
          # If we get here, health checks failed - show logs for debugging
          echo "❌ Health check failed after $max_attempts attempts"
          echo "📋 Container logs:"
          docker logs test-container
          docker stop test-container
          exit 1

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo ${{ steps.build.outputs.digest }}
